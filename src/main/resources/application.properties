# =============================================================================
# PeopleMesh — Application Configuration
# =============================================================================

quarkus.application.name=peoplemesh

# Disable Netty binder to avoid duplicate gauge registration warning at startup.
quarkus.micrometer.binder.netty.enabled=false

# -----------------------------------------------------------------------------
# HTTP / SSL / CORS
# -----------------------------------------------------------------------------
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:${quarkus.http.port}}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-allow-credentials=true

# -----------------------------------------------------------------------------
# MCP Server
# -----------------------------------------------------------------------------
quarkus.mcp-server.http.enabled=true

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
# Default tenant: bearer token verification for MCP tools
quarkus.oidc.tenant-enabled=false

# Login providers (OIDC — Multi-tenant)
peoplemesh.oidc.google.client-id=${OIDC_GOOGLE_CLIENT_ID:none}
peoplemesh.oidc.google.client-secret=${OIDC_GOOGLE_CLIENT_SECRET:none}
peoplemesh.oidc.microsoft.client-id=${OIDC_MICROSOFT_CLIENT_ID:none}
peoplemesh.oidc.microsoft.client-secret=${OIDC_MICROSOFT_CLIENT_SECRET:none}
peoplemesh.oidc.keycloak.client-id=${OIDC_KEYCLOAK_CLIENT_ID:none}
peoplemesh.oidc.keycloak.client-secret=${OIDC_KEYCLOAK_CLIENT_SECRET:none}
peoplemesh.oidc.keycloak.issuer-url=${OIDC_KEYCLOAK_ISSUER_URL:none}

# Import-only providers (credentials for profile import, not for login)
peoplemesh.oidc.github.client-id=${OIDC_GITHUB_CLIENT_ID:none}
peoplemesh.oidc.github.client-secret=${OIDC_GITHUB_CLIENT_SECRET:none}

# Authorization (HTTP auth permissions)
# MCP SSE endpoint requires authentication
quarkus.http.auth.permission.mcp-authenticated.paths=/mcp/*
quarkus.http.auth.permission.mcp-authenticated.policy=authenticated

# OAuth auth endpoints — public (no auth required)
quarkus.http.auth.permission.oauth-public.paths=/api/v1/auth/*
quarkus.http.auth.permission.oauth-public.policy=permit

# OAuth 2.1 authorization server and discovery metadata for MCP clients
quarkus.http.auth.permission.oauth-server-public.paths=/oauth/*,/.well-known/*
quarkus.http.auth.permission.oauth-server-public.policy=permit

# Maintenance endpoints — key-based auth, exempt from OIDC
quarkus.http.auth.permission.maintenance.paths=/api/v1/maintenance/*
quarkus.http.auth.permission.maintenance.policy=permit

# GET /api/v1/me — public at HTTP layer; method uses @PermitAll + optional session for current profile
quarkus.http.auth.permission.me-get-permit.paths=/api/v1/me
quarkus.http.auth.permission.me-get-permit.policy=permit
quarkus.http.auth.permission.me-get-permit.methods=GET
# Non-GET /api/v1/me must remain authenticated
quarkus.http.auth.permission.me-write-auth.paths=/api/v1/me
quarkus.http.auth.permission.me-write-auth.policy=authenticated
quarkus.http.auth.permission.me-write-auth.methods=POST,PUT,PATCH,DELETE

# Platform info endpoint — public (no auth required)
quarkus.http.auth.permission.info-public.paths=/api/v1/info
quarkus.http.auth.permission.info-public.policy=permit

# API endpoints require authentication (except paths already permitted above)
quarkus.http.auth.permission.api-authenticated.paths=/api/v1/*
quarkus.http.auth.permission.api-authenticated.policy=authenticated

# Health and readiness are public
quarkus.http.auth.permission.public-health.paths=/q/health/*
quarkus.http.auth.permission.public-health.policy=permit

# -----------------------------------------------------------------------------
# Datasource — PostgreSQL
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=${DB_POOL_MIN_SIZE:4}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX_SIZE:24}
quarkus.datasource.jdbc.acquisition-timeout=${DB_POOL_ACQUIRE_TIMEOUT:30s}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.jdbc.statement-batch-size=${HIBERNATE_BATCH_SIZE:32}
quarkus.hibernate-orm.jdbc.statement-fetch-size=${HIBERNATE_FETCH_SIZE:100}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=identity,audit,mesh,skills
# Flyway migration locations - schema migrations only by default (production safe)
# This is a BUILD-TIME property - value is baked into JAR during compilation
# To include seed data: rebuild with -Dquarkus.flyway.locations=classpath:db/migration,classpath:db/granite
# See docs/reference/seed-data.md for details
quarkus.flyway.locations=classpath:db/migration
# Suppress noisy Flyway warnings when migration SQL re-creates existing schemas.
quarkus.log.category."org.flywaydb.core.internal.sqlscript.DefaultSqlScriptExecutor".level=ERROR

# -----------------------------------------------------------------------------
# LangChain4j (OpenAI-compatible APIs)
# -----------------------------------------------------------------------------
# Base runtime defaults target the OpenAI API.
# Development profiles can still override these values to use an OpenAI-compatible local endpoint such as Ollama.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.timeout=20s
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:gpt-5.4-nano}
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.chat-model.max-completion-tokens=2500
quarkus.langchain4j.openai.chat-model.response-format=json_object
quarkus.langchain4j.openai.embedding-model.enabled=true
quarkus.langchain4j.openai.embedding-model.model-name=${EMBEDDING_MODEL:text-embedding-3-small}

# -----------------------------------------------------------------------------
# CV Import
# -----------------------------------------------------------------------------
quarkus.docling.timeout=60s
peoplemesh.cv-import.max-file-size=5242880
peoplemesh.cv-import.provider=${CV_IMPORT_PROVIDER:openai}
peoplemesh.embedding.dimension=${EMBEDDING_DIMENSION:384}

# -----------------------------------------------------------------------------
# PeopleMesh — Domain Configuration
# -----------------------------------------------------------------------------

# Frontend static serving
peoplemesh.frontend.enabled=${PEOPLEMESH_FRONTEND_ENABLED:false}
peoplemesh.frontend.dir=${PEOPLEMESH_FRONTEND_DIR:src/main/web}

# Common app security tokens/secrets
peoplemesh.problems.base-uri=${PROBLEMS_BASE_URI:about:blank}
peoplemesh.session.secret=${SESSION_SECRET}
peoplemesh.oauth.state-secret=${OAUTH_STATE_SECRET}

# Search
peoplemesh.search.candidate-pool-size=100

# Matching
peoplemesh.matching.candidate-pool-size=100

# Auto-Community Clustering
peoplemesh.clustering.enabled=${CLUSTERING_ENABLED:false}
peoplemesh.clustering.k=20
peoplemesh.clustering.min-cluster-size=5
peoplemesh.clustering.max-centroid-distance=0.4

# Skills
peoplemesh.skills.match-threshold=0.80
peoplemesh.skills.reconciliation-threshold=0.75

# Retention
peoplemesh.retention.inactive-months=12

# Notifications
peoplemesh.notification.enabled=true
peoplemesh.notification.dry-run=true
peoplemesh.notification.subject-prefix=[PeopleMesh]

# Maintenance
peoplemesh.maintenance.api-key=${MAINTENANCE_API_KEY:}
peoplemesh.maintenance.allowed-cidrs=${MAINTENANCE_ALLOWED_CIDRS:}

# Entitlements — oauth_subject values granted specific entitlements on login
peoplemesh.entitlements.is-admin=${ENTITLEMENTS_IS_ADMIN}

# Organization — identity and legal details shown in Privacy Policy and Terms of Service
peoplemesh.organization.name=${ORGANIZATION_NAME:}
peoplemesh.organization.contact-email=${ORGANIZATION_CONTACT_EMAIL:}
peoplemesh.organization.dpo-name=${ORGANIZATION_DPO_NAME:}
peoplemesh.organization.dpo-email=${ORGANIZATION_DPO_EMAIL:}
peoplemesh.organization.data-location=${ORGANIZATION_DATA_LOCATION:}
peoplemesh.organization.governing-law=${ORGANIZATION_GOVERNING_LAW:}
