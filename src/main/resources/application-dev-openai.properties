# =============================================================================
# PeopleMesh — Development Configuration (OpenAI)
# =============================================================================
#
# Run with:
#   mvn quarkus:dev -Dquarkus.profile=dev-openai
#
# Standalone local-dev profile that mirrors `dev` defaults while switching
# AI/CV import integrations from local Ollama/Docling to OpenAI.

# -----------------------------------------------------------------------------
# HTTP
# -----------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.ssl-port=443
quarkus.http.ssl.certificate.files=.certs/fullchain.pem
quarkus.http.ssl.certificate.key-files=.certs/privkey.pem

# -----------------------------------------------------------------------------
# Dev Services
# -----------------------------------------------------------------------------
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
quarkus.docling.devservices.enabled=false
# Required by the Docling extension at bootstrap even when CV import uses OpenAI.
quarkus.docling.base-url=http://localhost:5001
# Keycloak not needed — auth is direct OIDC with social providers
quarkus.keycloak.devservices.enabled=false
# OIDC default tenant is not used in local dev; avoid requiring auth-server-url.
quarkus.oidc.devservices.enabled=false

# -----------------------------------------------------------------------------
# Persistence
# -----------------------------------------------------------------------------
quarkus.flyway.locations=classpath:db/migration,classpath:db/dev-openai

quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=12
quarkus.datasource.jdbc.acquisition-timeout=20s

quarkus.hibernate-orm.jdbc.statement-batch-size=24
quarkus.hibernate-orm.jdbc.statement-fetch-size=100

# -----------------------------------------------------------------------------
# LangChain4j (OpenAI dev profile)
# -----------------------------------------------------------------------------
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.embedding-model.provider=openai
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.embedding-model.enabled=true
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.embedding-model.log-requests=false
quarkus.langchain4j.openai.embedding-model.log-responses=false
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:gpt-5.4-nano}
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.chat-model.max-completion-tokens=2500
quarkus.langchain4j.openai.chat-model.response-format=json_object
quarkus.langchain4j.openai.chat-model.log-requests=true
quarkus.langchain4j.openai.chat-model.log-responses=true
quarkus.langchain4j.openai.timeout=20s

# -----------------------------------------------------------------------------
# PeopleMesh (OpenAI dev overrides)
# -----------------------------------------------------------------------------
# Enable static frontend resource for local SPA serving in dev mode.
peoplemesh.frontend.enabled=true

# Dev secrets (safe defaults for local development only)
peoplemesh.consent-token.secret=default-dev-consent-secret-change-in-prod-32b!
peoplemesh.session.secret=default-dev-session-secret-change-in-prod-32b!!
peoplemesh.oauth.state-secret=default-dev-oauth-state-secret-change-prod-32b!

# Maintenance API key — auto-use dev-local-maintenance-key for localhost
peoplemesh.maintenance.api-key=dev-local-maintenance-key

# Organization name — shown in browser title and legal pages
peoplemesh.organization.name=My Company

# CV import provider
peoplemesh.cv-import.provider=langchain4j-pdf
