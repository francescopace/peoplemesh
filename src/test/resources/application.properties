

# Disable DevServices for services not needed in tests
quarkus.docling.devservices.enabled=false
quarkus.docling.base-url=http://localhost:5001

# CI test runners do not have local TLS cert files (.certs/*)
quarkus.http.ssl-port=0
quarkus.http.test-ssl-port=0
quarkus.http.ssl.certificate.files=
quarkus.http.ssl.certificate.key-files=

# Data source
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
quarkus.datasource.jdbc.acquisition-timeout=120
quarkus.datasource.jdbc.max-size=5
quarkus.flyway.clean-at-start=true

# Pin auth secrets for deterministic test runs
peoplemesh.session.secret=test-session-secret-32-chars-min-pad!
peoplemesh.consent-token.secret=test-consent-secret-32-chars-min-pad

# OpenAI-compatible beans wired for tests but no real calls
quarkus.langchain4j.openai.api-key=test-key
quarkus.langchain4j.openai.chat-model.model-name=test-dummy
quarkus.langchain4j.openai.embedding-model.model-name=test-dummy

# OAuth state secret for tests
peoplemesh.oauth.state-secret=test-oauth-state-secret-32chars!
